name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

# The Foundry project lives in the Contracts/ subdirectory, so all `run` steps
# execute there. (`uses` steps such as checkout still run from the repo root.)
defaults:
  run:
    working-directory: Contracts

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
