[profile.default]
src = "src"
out = "out"
libs = ["lib"]

solc = "0.8.28"
evm_version = "cancun"

optimizer = true
optimizer_runs = 1000

ignored_error_codes = [2394]

# Dependencies are managed as git submodules under lib/ (see remappings.txt and .gitmodules).
# Run `git submodule update --init --recursive` after cloning.

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
optimism_sepolia = "https://sepolia.optimism.io"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}" }